# Local/dev services that are not part of the Supabase stack (that one is run with `npx supabase start`).
services:
  ocr:
    build: ./ocr
    image: vehicle-passport-ocr:dev
    # Published on loopback only: the Quarkus server (on the host) calls http://127.0.0.1:8090.
    ports:
      - "127.0.0.1:8090:8000"
    environment:
      OCR_LANG: ro
      OCR_VERSION: PP-OCRv5
      OCR_DOC_ORIENTATION: "true"
      OCR_DOC_UNWARPING: "true"
      OCR_MAX_BYTES: "10485760"
    mem_limit: 4g
    cpus: 4
    restart: unless-stopped
