quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=vehicle_passport
quarkus.hibernate-orm.database.default-schema=vehicle_passport
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.hibernate-orm.mapping.format.global=ignore

%test.quarkus.arc.selected-alternatives=com.vehiclepassport.server.testsupport.fake.*
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.active=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.scheduler.enabled=false
%test.quarkus.oidc.tenant-enabled=false

%persistence.quarkus.datasource.devservices.enabled=true
%persistence.quarkus.datasource.devservices.image-name=postgres:17
%persistence.quarkus.scheduler.enabled=false
%persistence.quarkus.arc.selected-alternatives=com.vehiclepassport.server.testsupport.fake.FakeEventDocumentStorage,com.vehiclepassport.server.testsupport.fake.FakePassportFileStorage,com.vehiclepassport.server.testsupport.fake.FakeReceiptExtraction,com.vehiclepassport.server.testsupport.fake.FakeScanDocumentStorage
%persistence.quarkus.arc.exclude-types=com.vehiclepassport.server.event.steps.EventSteps,com.vehiclepassport.server.passport.steps.PassportSteps,com.vehiclepassport.server.scan.steps.ScanSteps,com.vehiclepassport.server.scan.steps.ReviewSteps

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:54322/postgres
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres

mp.openapi.scan.disable=true
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.path=/q/swagger-ui
%dev.quarkus.http.auth.permission.docs.paths=/q/openapi,/q/swagger-ui,/q/swagger-ui/*
%dev.quarkus.http.auth.permission.docs.policy=permit

quarkus.http.auth.permission.public.paths=/public/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.secured.paths=/*
quarkus.http.auth.permission.secured.policy=authenticated
quarkus.http.limits.max-body-size=210M
quarkus.oidc.application-type=service
quarkus.oidc.discovery-enabled=false
quarkus.oidc.auth-server-url=${SUPABASE_URL:http://127.0.0.1:54321}/auth/v1
quarkus.oidc.jwks-path=.well-known/jwks.json
quarkus.oidc.token.issuer=${quarkus.oidc.auth-server-url}
quarkus.oidc.token.audience=authenticated
passport.public-base-url=${PASSPORT_PUBLIC_BASE_URL:http://localhost:8080}
storage.endpoint=${STORAGE_S3_ENDPOINT:http://127.0.0.1:54321/storage/v1/s3}
storage.region=${STORAGE_S3_REGION:local}
storage.access-key=${STORAGE_S3_ACCESS_KEY:local}
storage.secret-key=${STORAGE_S3_SECRET_KEY:local}
storage.bucket=${STORAGE_S3_BUCKET:vehicle-passport}
%persistence.quarkus.oidc.tenant-enabled=false
%auth.quarkus.arc.selected-alternatives=com.vehiclepassport.server.testsupport.fake.*
%auth.quarkus.datasource.active=false
%auth.quarkus.hibernate-orm.active=false
%auth.quarkus.flyway.active=false
%auth.quarkus.datasource.devservices.enabled=false
%auth.quarkus.scheduler.enabled=false
%auth.quarkus.oidc.jwks-path=protocol/openid-connect/certs
%auth.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus
%auth.quarkus.oidc.token.issuer=https://server.example.com

quarkus.jackson.fail-on-unknown-properties=true
