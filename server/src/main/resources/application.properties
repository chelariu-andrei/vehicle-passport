quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=vehicle_passport
quarkus.hibernate-orm.database.default-schema=vehicle_passport
quarkus.hibernate-orm.schema-management.strategy=none

%test.quarkus.arc.selected-alternatives=com.vehiclepassport.server.testsupport.fake.*
%test.quarkus.datasource.active=false
%test.quarkus.hibernate-orm.active=false
%test.quarkus.flyway.active=false
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.scheduler.enabled=false

%persistence.quarkus.datasource.devservices.enabled=true
%persistence.quarkus.datasource.devservices.image-name=postgres:17
%persistence.quarkus.scheduler.enabled=false

%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.1:54322/postgres
%dev.quarkus.datasource.username=postgres
%dev.quarkus.datasource.password=postgres
