openapi: 3.1.0
info:
  title: Vehicle Passport API
  version: 1.0.0
  description: |
    Source of truth for the v1 HTTP API. All routes require a bearer JWT except `/public/**`.
    Every error produced by the API is `application/problem+json` (RFC 9457) with `type`, `title`, `status`, `detail`, `code`.
    Malformed JSON, unknown request fields, empty or null bodies and unparseable path ids answer 400 with code `validation-failed`.
    The one exception is 401: authentication is rejected before the API runs, so a missing, invalid or expired bearer token
    answers 401 with an empty body (not problem+json) on every route except `/public/**`.
    Requests on a vehicle the caller does not own answer 404 (no existence leak).
    Every business route outside `/public/**`, `/me*` and `/support/**` answers 403 with code `consent-required`
    until the caller has accepted the current terms and privacy policy (see `POST /me/consents`).
servers:
  - url: /
security:
  - bearerAuth: []
tags:
  - name: vehicles
  - name: claims
  - name: events
  - name: fuel
  - name: scans
  - name: passports
  - name: public
  - name: account
  - name: legal
  - name: support

paths:
  /vehicles:
    post:
      tags: [vehicles]
      operationId: registerVehicle
      summary: Register a vehicle, or file an ownership claim if it has an active owner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterVehicleRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '201':
          description: Vehicle registered, caller is now the active owner.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        '202':
          description: The VIN has another active owner; an ownership claim was filed for them to decide.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClaimFiledResponse' }
        '400':
          description: Codes `validation-failed` (request shape), `invalid-vin`, `invalid-vehicle`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Conflict. Code `already-owner` (caller already owns it) or `ownership-conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [vehicles]
      operationId: listMyVehicles
      summary: List vehicles in the caller's garage
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The caller's vehicles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VehicleResponse' }

  /vehicles/{vin}:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [vehicles]
      operationId: getVehicle
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    patch:
      tags: [vehicles]
      operationId: updateVehicle
      summary: Correct vehicle data (active owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVehicleRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The updated vehicle.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VehicleResponse' }
        '400':
          description: Codes `validation-failed` (request shape), `invalid-vin`, `invalid-vehicle`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/release:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [vehicles]
      operationId: releaseVehicle
      summary: Give up ownership (active owner only)
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Released. }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/claims:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [claims]
      operationId: listPendingClaims
      summary: Pending ownership claims on the vehicle (active owner only)
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: Pending claims.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingClaimResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/claims/{claimId}/approve:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [claims]
      operationId: approveClaim
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Approved; ownership transferred, other pending claims rejected. }
        '404':
          description: Code `vehicle-not-found` or `claim-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Conflict. Code `claim-not-pending` or `ownership-conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/claims/{claimId}/reject:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [claims]
      operationId: rejectClaim
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Rejected. }
        '404':
          description: Code `vehicle-not-found` or `claim-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `claim-not-pending`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /ownership-claims/{claimId}/withdraw:
    parameters:
      - $ref: '#/components/parameters/ClaimId'
    post:
      tags: [claims]
      operationId: withdrawClaim
      summary: Claimant withdraws their own pending claim
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Withdrawn. }
        '404':
          description: Code `claim-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `claim-not-pending`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/events:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [events]
      operationId: addEvent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '201':
          description: Event saved with evidence USER_CONFIRMED and source MANUAL.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '400':
          description: Code `validation-failed` (request shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Business rule violated. Code `odometer-inconsistent` or `invalid-event`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/events/{eventId}:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/EventId'
    put:
      tags: [events]
      operationId: updateEvent
      summary: Replace an event (only the owner of the period that created it)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventRequest' }
      responses:
        '200':
          description: The updated event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventResponse' }
        '400':
          description: Code `validation-failed` (request shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Code `event-from-prior-owner` (event was created in a previous ownership period) or `consent-required`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` or `event-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Business rule violated. Code `odometer-inconsistent`, `invalid-event` or `documented-event-immutable`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [events]
      operationId: deleteEvent
      summary: Soft-delete an event (only the owner of the period that created it)
      responses:
        '204': { description: Deleted. }
        '403':
          description: Code `event-from-prior-owner` (event was created in a previous ownership period) or `consent-required`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` or `event-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/events/{eventId}/document:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/EventId'
    get:
      tags: [events]
      operationId: getEventDocument
      deprecated: true
      summary: Deprecated alias for the event's first attachment (use `getAttachment`)
      responses:
        '200':
          description: The original file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403':
          description: Document restricted to the owner of the creating period (code `document-restricted`), or code `consent-required`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` or `event-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/events/{eventId}/attachments:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/EventId'
    post:
      tags: [events]
      operationId: addAttachment
      summary: Attach a file (image/jpeg, image/png, application/pdf, up to 10 MB; at most 10 per event)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Attachment stored with kind UPLOAD.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentResponse' }
        '400':
          description: Code `validation-failed` (the `file` part is missing).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '403':
          description: Code `event-from-prior-owner` (event was created in a previous ownership period).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` or `event-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `duplicate-document` (the same file is already attached to an event of this vehicle).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: Code `attachment-limit` (the event already has 10 attachments).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [events]
      operationId: listAttachments
      summary: Attachments of an event (only the owner of the period that created the event)
      responses:
        '200':
          description: The attachments, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AttachmentResponse' }
        '403':
          description: Code `document-restricted` (restricted to the owner of the creating period).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` or `event-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/events/{eventId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - $ref: '#/components/parameters/EventId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [events]
      operationId: getAttachment
      summary: The attached file (only the owner of the period that created the event)
      responses:
        '200':
          description: The file.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
        '403':
          description: Code `document-restricted` (restricted to the owner of the creating period).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found`, `event-not-found` or `attachment-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [events]
      operationId: deleteAttachment
      summary: Remove an attachment (only the owner of the period that created the event)
      responses:
        '204': { description: Deleted. }
        '403':
          description: Code `event-from-prior-owner` (event was created in a previous ownership period).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found`, `event-not-found` or `attachment-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Code `attachment-protected` (the attachment may not be removed).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/timeline:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [events]
      operationId: getTimeline
      summary: Chronological events of the VIN, across owners, creator identity stripped
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque cursor from a previous page's `nextCursor`.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
          description: Matches any of the given types (`?type=ITP&type=INSURANCE`).
        - name: component
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Component' }
          description: Matches events tagged with any of the given components.
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive, on the event date.
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: Inclusive, on the event date. `from` after `to` is refused.
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
          description: A cursor is only valid with the order it was issued for. Send the same filters on every page.
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: A page of events.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelinePage' }
        '400':
          description: Codes `validation-failed` (limit out of range, bad filter, `from` after `to`) or `invalid-cursor` (including a cursor used with a different `order`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/timeline/summary:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [events]
      operationId: getTimelineSummary
      summary: Aggregates of the VIN's timeline for the given filters
      parameters:
        - name: type
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/EventType' }
        - name: component
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Component' }
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: Counts, costs, distance and years for the filtered timeline.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimelineSummary' }
        '400':
          description: Code `validation-failed` (bad filter, `from` after `to`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/deadlines:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [events]
      operationId: getDeadlines
      summary: Status of the six documents of the VIN (always six items, in the fixed order)
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: One item per document kind, in the order ITP, RCA, CASCO, ROVINIETA, FIRE_EXTINGUISHER, FIRST_AID_KIT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlinesResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/fuel-entries:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [fuel]
      operationId: addFuelEntry
      summary: Log a fill-up or charge (active owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuelEntryRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '201':
          description: The saved entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuelEntryResponse' }
        '400':
          description: Code `validation-failed` (request shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Code `odometer-inconsistent` or `invalid-fuel-entry`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    get:
      tags: [fuel]
      operationId: listFuelEntries
      summary: The fuel entries of the car, newest first (active owner only)
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque cursor from a previous page's `nextCursor`.
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: A page of entries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuelEntryPage' }
        '400':
          description: Code `validation-failed` (limit out of range or malformed cursor).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/fuel-entries/{entryId}:
    parameters:
      - $ref: '#/components/parameters/Vin'
      - name: entryId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [fuel]
      operationId: updateFuelEntry
      summary: Replace a fuel entry (active owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FuelEntryRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The updated entry.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuelEntryResponse' }
        '400':
          description: Code `validation-failed` (request shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Codes `vehicle-not-found` or `fuel-entry-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Code `odometer-inconsistent` or `invalid-fuel-entry`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [fuel]
      operationId: deleteFuelEntry
      summary: Delete a fuel entry (active owner only)
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Deleted. }
        '404':
          description: Codes `vehicle-not-found` or `fuel-entry-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/fuel/stats:
    parameters:
      - $ref: '#/components/parameters/Vin'
    get:
      tags: [fuel]
      operationId: getFuelStats
      summary: Consumption, cost and price statistics, computed on read
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: ['3m', '6m', '12m', all], default: '6m' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: Statistics. Always 200 for an owned car, with nulls and empty arrays when there is too little data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FuelStatsResponse' }
        '400':
          description: Code `validation-failed` (unknown period).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/scans:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [scans]
      operationId: submitScan
      summary: Upload one invoice (image/jpeg, image/png, application/pdf, up to 10 MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '202':
          description: Scan job accepted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanJobResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /vehicles/{vin}/scan-batches:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [scans]
      operationId: submitScanBatch
      summary: Upload up to 20 invoices in one request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { type: string, format: binary }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '202':
          description: Batch accepted, one job per file.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanBatchResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422':
          description: More than 20 files. Code `batch-too-large`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /scans/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [scans]
      operationId: getScan
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: Current job state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanJobResponse' }
        '404':
          description: Code `scan-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /scans/{jobId}/confirm:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [scans]
      operationId: confirmScan
      summary: Confirm (optionally correcting) extracted data; creates a DOCUMENTED event
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmScanRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '201':
          description: Event created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmScanResponse' }
        '400':
          description: Code `validation-failed` (request shape).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Code `scan-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `scan-state-conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Business rule violated (for example `odometer-inconsistent`).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /scans/{jobId}/reject:
    parameters:
      - $ref: '#/components/parameters/JobId'
    post:
      tags: [scans]
      operationId: rejectScan
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Rejected. }
        '404':
          description: Code `scan-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `scan-state-conflict`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /vehicles/{vin}/passports:
    parameters:
      - $ref: '#/components/parameters/Vin'
    post:
      tags: [passports]
      operationId: createPassport
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePassportRequest' }
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '201':
          description: Passport created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassportResponse' }
        '404':
          description: Code `vehicle-not-found` (unknown, or not visible to the caller).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Expiry is in the past. Code `expiry-in-past`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /passports:
    get:
      tags: [passports]
      operationId: listMyPassports
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The caller's passports.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PassportResponse' }

  /passports/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    post:
      tags: [passports]
      operationId: revokePassport
      summary: Revoke the public link (idempotent)
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '204': { description: Revoked. }
        '404':
          description: Code `passport-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /passports/{id}/pdf:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      tags: [passports]
      operationId: getPassportPdf
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: The passport PDF.
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '404':
          description: Code `passport-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /passports/{id}/qr:
    parameters:
      - $ref: '#/components/parameters/PassportId'
    get:
      tags: [passports]
      operationId: getPassportQr
      responses:
        '403': { $ref: '#/components/responses/ConsentRequired' }
        '200':
          description: QR code image encoding the public URL.
          content:
            image/png: { schema: { type: string, format: binary } }
        '404':
          description: Code `passport-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/passports/{token}:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [public]
      operationId: getPublicPassport
      summary: Public, unauthenticated, read-only snapshot
      security: []
      responses:
        '200':
          description: Snapshot with its integrity hash.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicPassportResponse' }
        '404':
          description: Code `passport-not-found` (unknown, revoked or expired token; identical response).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/passports/{token}/pdf:
    parameters:
      - $ref: '#/components/parameters/Token'
    get:
      tags: [public]
      operationId: getPublicPassportPdf
      security: []
      responses:
        '200':
          description: The passport PDF.
          content:
            application/pdf: { schema: { type: string, format: binary } }
        '404':
          description: Code `passport-not-found` (unknown, revoked or expired token; identical response).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /public/legal/documents:
    get:
      tags: [legal]
      operationId: listLegalDocuments
      summary: Current version of every legal document, in the requested locale
      security: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: One summary per document type. Falls back to `en` when the locale has no text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocumentsResponse' }

  /public/legal/documents/{type}:
    parameters:
      - $ref: '#/components/parameters/LegalDocumentTypePath'
    get:
      tags: [legal]
      operationId: getLegalDocument
      summary: Current version of one legal document, in the requested locale
      security: []
      parameters:
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: The document. Falls back to `en` when the locale has no text.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LegalDocument' }
        '404':
          description: Code `legal-document-not-found`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: The caller's profile, usage stats, pending deletion and consent status
      responses:
        '200':
          description: The caller's account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
    patch:
      tags: [account]
      operationId: updateProfile
      summary: Update display name and/or phone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfilePatch' }
      responses:
        '200':
          description: The updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '400':
          description: Code `validation-failed`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/settings:
    get:
      tags: [account]
      operationId: getSettings
      responses:
        '200':
          description: The caller's settings (defaults when never saved).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsDto' }
    put:
      tags: [account]
      operationId: updateSettings
      summary: Replace the caller's settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsDto' }
      responses:
        '200':
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SettingsDto' }
        '400':
          description: Code `validation-failed`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/consents:
    get:
      tags: [account]
      operationId: getConsentStatus
      responses:
        '200':
          description: Current consent status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
    post:
      tags: [account]
      operationId: recordConsents
      summary: Accept legal documents and/or set the marketing and analytics choices
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentUpdate' }
      responses:
        '200':
          description: The resulting consent status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentStatus' }
        '400':
          description: Code `validation-failed`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Code `consent-version-outdated` (an accepted version is no longer the current one).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/consents/history:
    get:
      tags: [account]
      operationId: listConsentHistory
      responses:
        '200':
          description: Consent events, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentHistoryResponse' }

  /me/deletion:
    post:
      tags: [account]
      operationId: scheduleDeletion
      summary: Schedule account deletion after the grace period
      responses:
        '201':
          description: Deletion scheduled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeletionStatus' }
        '409':
          description: Code `deletion-already-scheduled`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [account]
      operationId: cancelDeletion
      summary: Cancel a scheduled deletion
      responses:
        '204': { description: Deletion cancelled. }
        '404':
          description: Code `deletion-not-scheduled`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/export:
    get:
      tags: [account]
      operationId: exportMyData
      summary: Download everything stored about the caller
      responses:
        '200':
          description: The export, as a file download.
          headers:
            Content-Disposition:
              description: '`attachment`, with a filename.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountExport' }

  /support/reports:
    post:
      tags: [support]
      operationId: createSupportReport
      summary: Send a problem report or question to support
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportReportRequest' }
      responses:
        '201':
          description: Report received.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportReportResponse' }
        '400':
          description: Code `validation-failed`.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Vin:
      name: vin
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Vin' }
    ClaimId:
      name: claimId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EventId:
      name: eventId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PassportId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 22 }
    Locale:
      name: locale
      in: query
      required: false
      schema: { type: string, enum: [ro, en], default: en }
      description: Falls back to `en` when the requested locale has no text.
    LegalDocumentTypePath:
      name: type
      in: path
      required: true
      schema: { $ref: '#/components/schemas/LegalDocumentType' }

  responses:
    ConsentRequired:
      description: >
        The caller has not accepted the current terms and privacy policy. Code `consent-required`.
        Accept them through `POST /me/consents`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PayloadTooLarge:
      description: File larger than 10 MB. Code `file-too-large`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnsupportedMediaType:
      description: Not image/jpeg, image/png or application/pdf. Code `unsupported-file`.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: Stable machine-readable error code. }

    Vin:
      type: string
      pattern: '^[A-HJ-NPR-Z0-9]{17}$'
      description: 17 characters, ISO 3779 charset (no I, O, Q). The check digit is not enforced.
      examples: [WVWZZZ1JZXW000001]

    FuelType:
      type: string
      enum: [PETROL, DIESEL, HYBRID, ELECTRIC, LPG, OTHER]

    BodyType: { type: string, enum: [HATCHBACK, SEDAN, ESTATE, SUV, COUPE, MPV, PICKUP] }
    PaintColor: { type: string, enum: [WHITE, BLACK, SILVER, GREY, BLUE, RED, GREEN, BEIGE, BROWN, YELLOW, ORANGE, GOLD] }
    PaintFinish: { type: string, enum: [GLOSS, METALLIC, SATIN, MATTE] }
    WheelStyle: { type: string, enum: [FIVE_SPOKE, MULTI_SPOKE, AERO] }
    RimColor: { type: string, enum: [SILVER, BLACK, BODY] }
    GlassTint: { type: string, enum: [LIGHT, DARK] }
    Plate:
      type: string
      minLength: 1
      maxLength: 10
      pattern: '^[A-Z0-9](?:[A-Z0-9 -]{0,8}[A-Z0-9])?$'
      description: Number plate as the owner typed it, normalised. Owner-only; never part of a passport; cleared on transfer.
    VehicleAppearance:
      type: object
      description: How the illustrative model is drawn. Visual only. Transfers with the car.
      additionalProperties: false
      properties:
        bodyType: { $ref: '#/components/schemas/BodyType' }
        color: { $ref: '#/components/schemas/PaintColor' }
        colorHex: { type: string, pattern: '^#[0-9a-f]{6}$', description: "The owner's own shade. `color` then holds the nearest named colour." }
        finish: { $ref: '#/components/schemas/PaintFinish' }
        wheels: { $ref: '#/components/schemas/WheelStyle' }
        rimColor: { $ref: '#/components/schemas/RimColor' }
        glassTint: { $ref: '#/components/schemas/GlassTint' }
        contrastRoof: { type: boolean }

    EventType:
      type: string
      enum: [SERVICE, REPAIR, TIRES, ITP, ROVINIETA, INSURANCE, SAFETY_EQUIPMENT, OTHER]

    ScanEventType:
      type: string
      description: The event types a scan can be confirmed as.
      enum: [SERVICE, REPAIR, TIRES, ITP]

    Component:
      type: string
      enum: [ENGINE, TRANSMISSION, BRAKES, SUSPENSION, STEERING, TIRES_WHEELS, ELECTRICAL, CLIMATE, BODY, EXHAUST, INTERIOR, FLUIDS, OTHER]

    InsuranceCoverage:
      type: string
      enum: [RCA, CASCO]

    RovinietaDuration:
      type: string
      enum: [ONE_DAY, SEVEN_DAYS, THIRTY_DAYS, NINETY_DAYS, TWELVE_MONTHS]

    ItpResult:
      type: string
      enum: [PASSED, PASSED_WITH_REMARKS, FAILED]

    SafetyItem:
      type: string
      enum: [FIRE_EXTINGUISHER, FIRST_AID_KIT]

    ValidityStatus:
      type: string
      enum: [VALID, EXPIRING, EXPIRED, SUPERSEDED, UNKNOWN]

    CustomField:
      type: object
      required: [label, value]
      additionalProperties: false
      properties:
        label: { type: string, minLength: 1, maxLength: 40 }
        value: { type: string, minLength: 1, maxLength: 200 }

    Evidence:
      type: string
      enum: [ESTIMATED, USER_CONFIRMED, DOCUMENTED, VERIFIED]

    EventSource:
      type: string
      enum: [MANUAL, SCAN]

    RegisterVehicleRequest:
      type: object
      required: [vin, make, model, year, fuel]
      additionalProperties: false
      properties:
        vin: { $ref: '#/components/schemas/Vin' }
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        engine: { type: string, maxLength: 100 }
        year:
          type: integer
          minimum: 1886
          description: Maximum is the current year + 1, enforced by the server.
        fuel: { $ref: '#/components/schemas/FuelType' }

    UpdateVehicleRequest:
      type: object
      description: Partial update; the VIN cannot change. At least one field is required.
      additionalProperties: false
      minProperties: 1
      properties:
        make: { type: string, minLength: 1, maxLength: 100 }
        model: { type: string, minLength: 1, maxLength: 100 }
        engine: { type: string, maxLength: 100 }
        year:
          type: integer
          minimum: 1886
          description: Maximum is the current year + 1, enforced by the server.
        fuel: { $ref: '#/components/schemas/FuelType' }
        plate:
          description: Null clears the plate.
          oneOf: [{ $ref: '#/components/schemas/Plate' }, { type: 'null' }]
        appearance: { $ref: '#/components/schemas/VehicleAppearance' }

    VehicleResponse:
      type: object
      required: [vin, make, model, year, fuel]
      properties:
        vin: { $ref: '#/components/schemas/Vin' }
        make: { type: string }
        model: { type: string }
        engine: { type: [string, 'null'] }
        year: { type: integer }
        fuel: { $ref: '#/components/schemas/FuelType' }
        plate:
          oneOf: [{ $ref: '#/components/schemas/Plate' }, { type: 'null' }]
        appearance:
          oneOf: [{ $ref: '#/components/schemas/VehicleAppearance' }, { type: 'null' }]

    ClaimFiledResponse:
      type: object
      required: [claimId, filedAt]
      properties:
        claimId: { type: string, format: uuid }
        filedAt: { type: string, format: date-time }

    PendingClaimResponse:
      type: object
      description: Shows only the claim id and filing date, never the claimant's identity.
      required: [claimId, filedAt]
      properties:
        claimId: { type: string, format: uuid }
        filedAt: { type: string, format: date-time }

    EventRequest:
      type: object
      required: [type, date, costAmount, currency]
      additionalProperties: false
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        date:
          type: string
          format: date
          description: Must not be in the future.
        odometerKm:
          type: [integer, 'null']
          minimum: 0
          description: Required for SERVICE, REPAIR, TIRES and ITP; optional otherwise. The server enforces it (`validation-failed`).
        costAmount: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [RON] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        customLabel:
          type: [string, 'null']
          minLength: 1
          maxLength: 60
          description: Required for OTHER, forbidden for every other type.
        validFrom: { type: [string, 'null'], format: date }
        validUntil:
          type: [string, 'null']
          format: date
          description: Never sent for ROVINIETA (computed by the server from `validFrom` and `duration`).
        details:
          description: Required for ROVINIETA, INSURANCE and SAFETY_EQUIPMENT; optional for ITP; `kind` must match the event type.
          oneOf:
            - $ref: '#/components/schemas/EventDetailsInput'
            - type: 'null'
        components:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Component' }
        customFields:
          type: array
          maxItems: 10
          items: { $ref: '#/components/schemas/CustomField' }

    Part:
      type: object
      required: [name, qty, price]
      properties:
        name: { type: string }
        qty: { type: number, minimum: 0 }
        price: { type: number, minimum: 0 }

    ScanDetails:
      type: object
      description: Structured data from a confirmed scan. Read-only output.
      required: [kind]
      properties:
        kind: { type: string, enum: [SCAN] }
        serviceName: { type: [string, 'null'] }
        parts:
          type: array
          items: { $ref: '#/components/schemas/Part' }
        labor: { type: [number, 'null'] }

    InsuranceDetails:
      type: object
      required: [kind, coverage, insurer]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [INSURANCE] }
        coverage: { $ref: '#/components/schemas/InsuranceCoverage' }
        insurer: { type: string, minLength: 1, maxLength: 100 }
        policyNumber: { type: [string, 'null'], maxLength: 60 }

    RovinietaDetails:
      type: object
      required: [kind, duration]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [ROVINIETA] }
        duration: { $ref: '#/components/schemas/RovinietaDuration' }

    ItpDetails:
      type: object
      required: [kind]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [ITP] }
        station: { type: [string, 'null'], maxLength: 100 }
        result:
          oneOf:
            - $ref: '#/components/schemas/ItpResult'
            - type: 'null'

    SafetyEquipmentDetails:
      type: object
      required: [kind, item]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [SAFETY_EQUIPMENT] }
        item: { $ref: '#/components/schemas/SafetyItem' }

    EventDetailsInput:
      description: Details a client may send, discriminated by `kind`. SCAN details are never accepted.
      oneOf:
        - $ref: '#/components/schemas/InsuranceDetails'
        - $ref: '#/components/schemas/RovinietaDetails'
        - $ref: '#/components/schemas/ItpDetails'
        - $ref: '#/components/schemas/SafetyEquipmentDetails'
      discriminator:
        propertyName: kind
        mapping:
          INSURANCE: '#/components/schemas/InsuranceDetails'
          ROVINIETA: '#/components/schemas/RovinietaDetails'
          ITP: '#/components/schemas/ItpDetails'
          SAFETY_EQUIPMENT: '#/components/schemas/SafetyEquipmentDetails'

    EventDetailsOutput:
      description: Details of an event, discriminated by `kind`.
      oneOf:
        - $ref: '#/components/schemas/ScanDetails'
        - $ref: '#/components/schemas/InsuranceDetails'
        - $ref: '#/components/schemas/RovinietaDetails'
        - $ref: '#/components/schemas/ItpDetails'
        - $ref: '#/components/schemas/SafetyEquipmentDetails'
      discriminator:
        propertyName: kind
        mapping:
          SCAN: '#/components/schemas/ScanDetails'
          INSURANCE: '#/components/schemas/InsuranceDetails'
          ROVINIETA: '#/components/schemas/RovinietaDetails'
          ITP: '#/components/schemas/ItpDetails'
          SAFETY_EQUIPMENT: '#/components/schemas/SafetyEquipmentDetails'

    EventResponse:
      type: object
      description: Carries no creator or ownership-period information.
      required: [id, type, date, odometerKm, costAmount, currency, evidence, source, documentPresent, attachmentCount, components, customFields]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EventType' }
        date: { type: string, format: date }
        odometerKm: { type: [integer, 'null'] }
        costAmount: { type: number }
        currency: { type: string }
        notes: { type: [string, 'null'] }
        customLabel: { type: [string, 'null'] }
        validFrom: { type: [string, 'null'], format: date }
        validUntil: { type: [string, 'null'], format: date }
        validityStatus:
          readOnly: true
          description: Computed by the server from the validity rules; null for types without validity.
          oneOf:
            - $ref: '#/components/schemas/ValidityStatus'
            - type: 'null'
        details:
          oneOf:
            - $ref: '#/components/schemas/EventDetailsOutput'
            - type: 'null'
        components:
          type: array
          items: { $ref: '#/components/schemas/Component' }
        customFields:
          type: array
          items: { $ref: '#/components/schemas/CustomField' }
        evidence: { $ref: '#/components/schemas/Evidence' }
        source: { $ref: '#/components/schemas/EventSource' }
        documentPresent: { type: boolean }
        attachmentCount: { type: integer, minimum: 0 }

    AttachmentResponse:
      type: object
      required: [id, contentType, sizeBytes, sha256, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        contentType: { type: string }
        sizeBytes: { type: integer }
        sha256:
          type: [string, 'null']
          description: Hex SHA-256 of the raw bytes. Null for source documents of scans confirmed before hashing existed.
        kind:
          type: string
          description: SCAN_SOURCE is the invoice a scan was confirmed from; UPLOAD was added by the user.
          enum: [SCAN_SOURCE, UPLOAD]
        createdAt: { type: string, format: date-time }

    TimelinePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EventResponse' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.

    FuelEntryType: { type: string, enum: [PETROL, DIESEL, LPG, ELECTRIC] }
    FuelGrade: { type: string, enum: [STANDARD, PREMIUM] }
    ChargeType: { type: string, enum: [HOME, AC_PUBLIC, DC_FAST] }
    FuelUnit: { type: string, enum: [L, KWH] }

    FuelEntryRequest:
      type: object
      additionalProperties: false
      required: [date, odometerKm, fuelType, quantity, total, currency]
      properties:
        date: { type: string, format: date }
        odometerKm: { type: integer, minimum: 0 }
        fuelType: { $ref: '#/components/schemas/FuelEntryType' }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 9999, multipleOf: 0.001, description: 'Litres, or kWh for ELECTRIC; at most 3 decimals.' }
        total: { type: number, minimum: 0, maximum: 999999, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        fullTank: { type: boolean, default: true }
        missedPrevious: { type: boolean, default: false, description: The previous fill-up was not logged; no consumption is computed across the gap. }
        grade: { $ref: '#/components/schemas/FuelGrade' }
        chargeType: { $ref: '#/components/schemas/ChargeType' }
        station: { type: string, maxLength: 60 }
        note: { type: string, maxLength: 200 }

    FuelEntryResponse:
      type: object
      required: [id, date, odometerKm, fuelType, quantity, unit, total, unitPrice, currency, fullTank, missedPrevious]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        odometerKm: { type: integer }
        fuelType: { $ref: '#/components/schemas/FuelEntryType' }
        quantity: { type: number }
        unit: { $ref: '#/components/schemas/FuelUnit' }
        total: { type: number }
        unitPrice: { type: number, description: total / quantity, 4 decimals. }
        currency: { type: string }
        fullTank: { type: boolean }
        missedPrevious: { type: boolean }
        grade:
          oneOf:
            - $ref: '#/components/schemas/FuelGrade'
            - type: 'null'
        chargeType:
          oneOf:
            - $ref: '#/components/schemas/ChargeType'
            - type: 'null'
        station: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        consumption:
          type: [number, 'null']
          description: Per 100 km. Set on the full fill-up that closes an included consumption segment; otherwise null.

    FuelEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FuelEntryResponse' }
        nextCursor:
          type: [string, 'null']
          description: Null on the last page.

    FuelStatsPoint:
      type: object
      required: [entryId, date, odometerKm, unitPrice]
      properties:
        entryId: { type: string, format: uuid }
        date: { type: string, format: date }
        odometerKm: { type: integer }
        unitPrice: { type: number }
        consumption: { type: [number, 'null'] }

    FuelConsumptionAlert:
      type: object
      required: [latest, baseline, deltaPct, entryId]
      properties:
        latest: { type: number }
        baseline: { type: number }
        deltaPct: { type: number }
        entryId: { type: string, format: uuid }

    FuelGradeComparison:
      type: object
      required: [grade, avgConsumption, segmentCount]
      properties:
        grade: { $ref: '#/components/schemas/FuelGrade' }
        avgConsumption: { type: number }
        segmentCount: { type: integer }

    FuelTypeStats:
      type: object
      required: [fuelType, unit, segmentCount, points, gradeComparison]
      properties:
        fuelType: { $ref: '#/components/schemas/FuelEntryType' }
        unit: { $ref: '#/components/schemas/FuelUnit' }
        avgConsumption: { type: [number, 'null'] }
        lastConsumption: { type: [number, 'null'] }
        avgUnitPrice: { type: [number, 'null'] }
        segmentCount: { type: integer }
        points:
          type: array
          description: Every entry of this fuel type, chronological.
          items: { $ref: '#/components/schemas/FuelStatsPoint' }
        alert:
          oneOf:
            - $ref: '#/components/schemas/FuelConsumptionAlert'
            - type: 'null'
        gradeComparison:
          type: array
          description: Empty unless both grades have at least 3 segments.
          items: { $ref: '#/components/schemas/FuelGradeComparison' }

    FuelMonthCost:
      type: object
      required: [month, cost, quantity, entries]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        cost: { type: number }
        quantity: { type: number }
        entries: { type: integer }
        distanceKm: { type: [integer, 'null'] }

    FuelMonthEstimate:
      type: object
      required: [month, spentSoFar]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
        spentSoFar: { type: number }
        projected: { type: [number, 'null'], description: Null with fewer than 3 entries in the last 60 days. }

    FuelStatsPeriod:
      type: object
      properties:
        from: { type: [string, 'null'], format: date }
        to: { type: [string, 'null'], format: date }

    FuelStatsResponse:
      type: object
      required: [entryCount, ignoredEntries, totalCost, period, monthly, monthEstimate, byFuelType]
      properties:
        currency: { type: [string, 'null'], description: The currency with the most entries in the period; null with no entries. }
        period: { $ref: '#/components/schemas/FuelStatsPeriod' }
        lastOdometerKm: { type: [integer, 'null'], description: Highest km across events and fuel entries. }
        entryCount: { type: integer }
        ignoredEntries: { type: integer, description: Entries left out because they use another currency. }
        totalCost: { type: number }
        costPerKm: { type: [number, 'null'] }
        monthly:
          type: array
          items: { $ref: '#/components/schemas/FuelMonthCost' }
        monthEstimate: { $ref: '#/components/schemas/FuelMonthEstimate' }
        byFuelType:
          type: array
          items: { $ref: '#/components/schemas/FuelTypeStats' }

    TypeCount:
      type: object
      required: [type, count]
      properties:
        type: { $ref: '#/components/schemas/EventType' }
        count: { type: integer, minimum: 1 }

    CurrencyAmount:
      type: object
      required: [currency, amount]
      properties:
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount: { type: number, multipleOf: 0.01 }

    Distance:
      type: object
      description: Computed from all events of the car that have km in the period, ignoring the type and component filters.
      required: [km, fromKm, toKm]
      properties:
        km: { type: [integer, 'null'], description: "`toKm` - `fromKm`; null when fewer than two readings are available." }
        fromKm: { type: [integer, 'null'], description: "Last reading before `from`, or else the first reading in the period; null when that would be the same reading as `toKm`." }
        toKm: { type: [integer, 'null'], description: "Last reading in the period." }

    TimelineSummary:
      type: object
      required: [eventCount, countsByType, costByCurrency, distance, years]
      properties:
        eventCount: { type: integer, minimum: 0 }
        countsByType:
          type: array
          description: Only types with a count above zero.
          items: { $ref: '#/components/schemas/TypeCount' }
        costByCurrency:
          type: array
          description: Sorted by amount, descending.
          items: { $ref: '#/components/schemas/CurrencyAmount' }
        distance: { $ref: '#/components/schemas/Distance' }
        years:
          type: array
          description: Every year with at least one event, newest first, ignoring all filters.
          items: { type: integer }

    ScanStatus:
      type: string
      description: CANCELLED means ownership ended before the scan was confirmed.
      enum: [PENDING, PROCESSING, EXTRACTED, CONFIRMED, REJECTED, FAILED, CANCELLED]

    ScanField:
      type: object
      required: [value, confidence]
      properties:
        value: {}
        confidence: { type: number, minimum: 0, maximum: 1 }

    ScanFields:
      type: object
      properties:
        serviceName: { $ref: '#/components/schemas/ScanField' }
        date: { $ref: '#/components/schemas/ScanField' }
        odometerKm: { $ref: '#/components/schemas/ScanField' }
        parts: { $ref: '#/components/schemas/ScanField' }
        labor: { $ref: '#/components/schemas/ScanField' }
        total: { $ref: '#/components/schemas/ScanField' }

    ScanWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, examples: [TOTAL_MISMATCH, ODOMETER_INCONSISTENT, DATE_IN_FUTURE, LOW_CONFIDENCE_READ, TOTALS_INCONSISTENT, PART_ROW_SKIPPED, PART_LINE_MISMATCH] }
        message: { type: string }

    ScanJobResponse:
      type: object
      required: [id, status, warnings]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ScanStatus' }
        fields:
          description: Present once extraction has finished.
          oneOf:
            - $ref: '#/components/schemas/ScanFields'
            - type: 'null'
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ScanWarning' }

    ScanBatchResponse:
      type: object
      required: [jobs]
      properties:
        jobs:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ScanJobResponse' }

    ConfirmScanRequest:
      type: object
      description: The reviewed (possibly corrected) data. Low confidence never blocks confirmation.
      required: [date, odometerKm, total]
      additionalProperties: false
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/ScanEventType'
          default: SERVICE
        serviceName: { type: [string, 'null'] }
        date: { type: string, format: date }
        odometerKm: { type: integer, minimum: 0 }
        parts:
          type: array
          items: { $ref: '#/components/schemas/Part' }
        labor: { type: [number, 'null'], minimum: 0 }
        total: { type: number, minimum: 0 }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: RON }
        notes: { type: [string, 'null'], maxLength: 2000 }
        validUntil:
          type: [string, 'null']
          format: date
          description: Only allowed when `type` is ITP; refused otherwise with `validation-failed`.
        itpResult:
          description: Only allowed when `type` is ITP; refused otherwise with `validation-failed`.
          oneOf:
            - $ref: '#/components/schemas/ItpResult'
            - type: 'null'

    ConfirmScanResponse:
      type: object
      required: [eventId]
      properties:
        eventId: { type: string, format: uuid }

    CreatePassportRequest:
      type: object
      additionalProperties: false
      properties:
        expiresAt:
          type: [string, 'null']
          format: date-time

    PassportStatus:
      type: string
      enum: [ACTIVE, REVOKED, EXPIRED]

    PassportResponse:
      type: object
      required: [id, vin, publicUrl, hash, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        vin: { $ref: '#/components/schemas/Vin' }
        publicUrl: { type: string, format: uri }
        hash: { type: string, description: Hex SHA-256 of the canonical snapshot. }
        status: { $ref: '#/components/schemas/PassportStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }

    PublicPassportResponse:
      type: object
      required: [snapshot, hash, algorithm]
      properties:
        snapshot:
          type: object
          description: >
            Immutable snapshot: vehicle (vin, make, model, engine, year, fuel) and events
            (type, date, odometerKm, costAmount, currency, notes, serviceName, parts, labor, evidence,
            documentPresent). `serviceName`, `parts` and `labor` (scan details) are flat keys on the event,
            not nested under `details`; `parts` is omitted when the event has no parts detail, and money values
            are strings with two decimals. Newer fields are added only when non-empty or non-null, so a snapshot
            of old-style events is unchanged: `odometerKm` is omitted when the event has no km; `customLabel`,
            `validFrom`, `validUntil`, `components` and `customFields` are top-level event keys; details of the
            other kinds (INSURANCE, ROVINIETA, ITP, SAFETY_EQUIPMENT) are nested under `details: { kind, ... }`,
            the same as the API response. This format is permanent once a passport is hashed.
            No owner, creator or ownership-date information.
        hash: { type: string }
        algorithm: { type: string, enum: [SHA-256] }

    LegalDocumentType:
      type: string
      enum: [terms, privacy, data-sharing]

    LegalLocale:
      type: string
      enum: [ro, en]

    LegalDocumentSummary:
      type: object
      required: [type, version, locale, title, effectiveDate]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: string }
        locale: { $ref: '#/components/schemas/LegalLocale' }
        title: { type: string }
        effectiveDate: { type: string, format: date }

    LegalDocumentsResponse:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          items: { $ref: '#/components/schemas/LegalDocumentSummary' }

    LegalDocument:
      type: object
      required: [type, version, locale, title, bodyMarkdown, effectiveDate]
      properties:
        type: { $ref: '#/components/schemas/LegalDocumentType' }
        version: { type: string }
        locale: { $ref: '#/components/schemas/LegalLocale' }
        title: { type: string }
        bodyMarkdown: { type: string }
        effectiveDate: { type: string, format: date }

    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: '^[^\x00-\x1F\x7F]+$'
      description: Trimmed by the server; 1 to 80 characters, no control characters.

    PhoneNumber:
      type: string
      pattern: '^\+[1-9]\d{6,14}$'
      description: E.164.

    ProfilePatch:
      type: object
      description: Partial update. Omitted fields are unchanged; null clears the field.
      additionalProperties: false
      properties:
        displayName:
          oneOf: [{ $ref: '#/components/schemas/DisplayName' }, { type: 'null' }]
        phone:
          oneOf: [{ $ref: '#/components/schemas/PhoneNumber' }, { type: 'null' }]

    AccountStats:
      type: object
      required: [vehicles, events, passports]
      properties:
        vehicles: { type: integer, minimum: 0 }
        events: { type: integer, minimum: 0 }
        passports: { type: integer, minimum: 0 }

    DeletionStatus:
      type: object
      required: [scheduledFor]
      properties:
        scheduledFor: { type: string, format: date-time, description: When the account will be purged. }

    ConsentVersionState:
      type: object
      required: [currentVersion, acceptedVersion]
      properties:
        currentVersion: { type: string }
        acceptedVersion: { type: [string, 'null'] }

    ConsentStatus:
      type: object
      required: [required, terms, privacy, marketing, analytics]
      properties:
        required: { type: boolean, description: True when the current terms or privacy version is not accepted. }
        terms: { $ref: '#/components/schemas/ConsentVersionState' }
        privacy: { $ref: '#/components/schemas/ConsentVersionState' }
        marketing: { type: boolean }
        analytics: { type: boolean }

    MeResponse:
      type: object
      required: [id, email, emailVerified, displayName, phone, createdAt, stats, deletion, consent]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'] }
        emailVerified: { type: boolean }
        displayName: { type: [string, 'null'] }
        phone: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        stats: { $ref: '#/components/schemas/AccountStats' }
        deletion:
          description: Present while a deletion is scheduled.
          oneOf: [{ $ref: '#/components/schemas/DeletionStatus' }, { type: 'null' }]
        consent: { $ref: '#/components/schemas/ConsentStatus' }

    DocumentKind:
      type: string
      enum: [ITP, RCA, CASCO, ROVINIETA, FIRE_EXTINGUISHER, FIRST_AID_KIT]

    DeadlineStatus:
      type: string
      enum: [VALID, EXPIRING, EXPIRED, UNKNOWN, NOT_RECORDED]

    DeadlineItem:
      type: object
      required: [kind, status, validUntil, daysLeft, eventId]
      additionalProperties: false
      properties:
        kind: { $ref: '#/components/schemas/DocumentKind' }
        status: { $ref: '#/components/schemas/DeadlineStatus' }
        validUntil: { type: [string, 'null'], format: date }
        daysLeft:
          type: [integer, 'null']
          description: validUntil minus today; negative when expired, null without a date.
        eventId:
          type: [string, 'null']
          format: uuid
          description: The current entry of the document, null when none.

    DeadlinesResponse:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/DeadlineItem' }

    SettingsDto:
      type: object
      required: [language, appearance, units, notifications]
      additionalProperties: false
      properties:
        language: { type: string, enum: [system, ro, en] }
        appearance: { type: string, enum: [system, dark, light] }
        units:
          type: object
          required: [distance, currency]
          additionalProperties: false
          properties:
            distance: { type: string, enum: [km, mi] }
            currency: { type: string, enum: [RON, EUR, USD] }
        notifications:
          type: object
          required: [documentDeadlines, reminderDays, tireSeason, activityScans, activityPassportViews, activityTransfers, productNews]
          additionalProperties: false
          properties:
            documentDeadlines: { type: boolean }
            reminderDays:
              type: array
              uniqueItems: true
              maxItems: 3
              items: { type: integer, enum: [30, 7, 1] }
            tireSeason: { type: boolean }
            activityScans: { type: boolean }
            activityPassportViews: { type: boolean }
            activityTransfers: { type: boolean }
            productNews: { type: boolean }

    ConsentSource:
      type: string
      enum: [sign-up-form, social-sign-up, re-consent, settings]

    ConsentAcceptance:
      type: object
      required: [type, version]
      additionalProperties: false
      properties:
        type: { type: string, enum: [terms, privacy] }
        version: { type: string, minLength: 1, maxLength: 40 }

    ConsentUpdate:
      type: object
      required: [source]
      additionalProperties: false
      properties:
        accept:
          type: array
          items: { $ref: '#/components/schemas/ConsentAcceptance' }
        marketing: { type: boolean }
        analytics: { type: boolean }
        source: { $ref: '#/components/schemas/ConsentSource' }

    ConsentEvent:
      type: object
      required: [type, version, granted, source, at]
      properties:
        type: { type: string, enum: [terms, privacy, marketing, analytics] }
        version: { type: [string, 'null'], description: Null for marketing and analytics. }
        granted: { type: boolean }
        source: { $ref: '#/components/schemas/ConsentSource' }
        at: { type: string, format: date-time }

    ConsentHistoryResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConsentEvent' }

    AccountExport:
      type: object
      description: Everything stored about the caller, delivered as an attachment download (Content-Disposition attachment).
      required: [exportedAt, profile, settings, consents, vehicles, events, passports, fuelEntries, supportReports]
      properties:
        exportedAt: { type: string, format: date-time }
        profile: { $ref: '#/components/schemas/MeResponse' }
        settings: { $ref: '#/components/schemas/SettingsDto' }
        consents:
          type: array
          items: { $ref: '#/components/schemas/ConsentEvent' }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/VehicleResponse' }
        events:
          type: array
          description: Every event the caller recorded, also on cars sold since (never those of the car's other owners); `vin` says which car.
          items:
            allOf:
              - $ref: '#/components/schemas/EventResponse'
              - type: object
                required: [vin]
                properties:
                  vin: { $ref: '#/components/schemas/Vin' }
        passports:
          type: array
          items: { $ref: '#/components/schemas/PassportResponse' }
        fuelEntries:
          type: array
          description: Every fill-up the caller recorded, also on cars sold since (never those of the car's other owners); `vin` says which car.
          items:
            allOf:
              - $ref: '#/components/schemas/FuelEntryResponse'
              - type: object
                required: [vin]
                properties:
                  vin: { $ref: '#/components/schemas/Vin' }
        supportReports:
          type: array
          description: Support reports the caller sent, oldest first.
          items: { $ref: '#/components/schemas/SupportReportExport' }

    SupportReportExport:
      type: object
      required: [kind, message, diagnostics, createdAt]
      properties:
        kind: { type: string, enum: [problem, question] }
        message: { type: string }
        diagnostics:
          description: Present when the caller chose to send diagnostics.
          oneOf: [{ $ref: '#/components/schemas/SupportDiagnostics' }, { type: 'null' }]
        createdAt: { type: string, format: date-time }

    SupportDiagnostics:
      type: object
      required: [appVersion, platform, osVersion, deviceModel]
      additionalProperties: false
      properties:
        appVersion: { type: string, maxLength: 40 }
        platform: { type: string, maxLength: 40 }
        osVersion: { type: string, maxLength: 40 }
        deviceModel: { type: string, maxLength: 100 }

    SupportReportRequest:
      type: object
      required: [kind, message, includeDiagnostics]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [problem, question] }
        message: { type: string, minLength: 10, maxLength: 4000 }
        includeDiagnostics: { type: boolean }
        diagnostics: { $ref: '#/components/schemas/SupportDiagnostics' }

    SupportReportResponse:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
